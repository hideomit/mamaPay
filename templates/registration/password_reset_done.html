{% extends "base.html" %}

{% block title %}再設定メール送信完了{% endblock %}

{% block content %}
<style>
.reset-page {
    min-height: 78vh;
    background:
        linear-gradient(90deg, rgba(255,255,255,0.90), rgba(255,255,255,0.58)),
        url('/static/Yiepay2.png') center center / cover no-repeat;
    display: flex;
    align-items: center;
    padding: 48px 0;
}

.reset-card {
    max-width: 500px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.50);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    padding: 34px;
}

.reset-title {
    font-size: 1.6rem;
    font-weight: 900;
    color: #222;
    margin-bottom: 12px;
}

.reset-text {
    color: #5f6368;
    line-height: 1.8;
    margin-bottom: 24px;
}

.reset-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    padding: 12px 20px;
    background: rgba(255,255,255,0.92);
    color: #0d6efd;
    font-weight: 800;
    border: 1px solid rgba(13,110,253,0.20);
}
</style>

<div class="reset-page">
    <div class="container">
        <div class="reset-card">
            <h1 class="reset-title">メールを送信しました</h1>
            <p class="reset-text">入力されたメールアドレスに、パスワード再設定用のリンクを送信しました。メール本文のURLから新しいパスワードを設定してください。</p>
            <a class="reset-link" href="{% url 'login' %}">ログイン画面に戻る</a>
        </div>
    </div>
</div>
{% endblock %}

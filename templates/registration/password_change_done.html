{% extends "base.html" %}

{% block title %}パスワード変更完了{% endblock %}

{% block content %}
<style>
.password-page {
    min-height: 78vh;
    background:
        linear-gradient(90deg, rgba(255,255,255,0.90), rgba(255,255,255,0.58)),
        url('/static/Yiepay2.png') center center / cover no-repeat;
    display: flex;
    align-items: center;
    padding: 48px 0;
}

.password-card {
    max-width: 500px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.50);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    padding: 34px;
}

.password-title {
    font-size: 1.6rem;
    font-weight: 900;
    color: #222;
    margin-bottom: 12px;
}

.password-text {
    color: #5f6368;
    line-height: 1.8;
    margin-bottom: 24px;
}

.password-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    padding: 12px 20px;
    background: linear-gradient(135deg, #1f8fff, #0d6efd);
    color: #fff;
    font-weight: 800;
    box-shadow: 0 8px 20px rgba(13,110,253,0.28);
}

.password-link:hover {
    color: #fff;
    text-decoration: none;
}
</style>

<div class="password-page">
    <div class="container">
        <div class="password-card">
            <h1 class="password-title">パスワードを変更しました</h1>
            <p class="password-text">次回から新しいパスワードでログインできます。</p>
            <a class="password-link" href="{% url 'home' %}">ホームに戻る</a>
        </div>
    </div>
</div>
{% endblock %}

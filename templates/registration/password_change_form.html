{% extends "base.html" %}

{% block title %}パスワード変更{% endblock %}

{% block content %}
<style>
.password-page {
    min-height: 78vh;
    background:
        linear-gradient(90deg, rgba(255,255,255,0.90), rgba(255,255,255,0.58)),
        url('/static/Yiepay2.png') center center / cover no-repeat;
    display: flex;
    align-items: center;
    padding: 48px 0;
}

.password-card {
    max-width: 520px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.50);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    padding: 34px;
}

.password-title {
    font-size: 1.6rem;
    font-weight: 900;
    color: #222;
    margin-bottom: 12px;
}

.password-text {
    color: #5f6368;
    line-height: 1.8;
    margin-bottom: 24px;
}

.password-card label {
    font-weight: 700;
    color: #222;
}

.password-card input {
    width: 100%;
    border-radius: 14px;
    border: 1px solid rgba(13,110,253,0.18);
    background: rgba(255,255,255,0.95);
    padding: 13px 15px;
    margin: 8px 0 14px;
}

.password-card input:focus {
    outline: none;
    border-color: #0d6efd;
    box-shadow: 0 0 0 4px rgba(13,110,253,0.10);
}

.password-card ul {
    color: #5f6368;
    padding-left: 20px;
}

.password-card .errorlist {
    color: #dc3545;
    font-weight: 700;
    margin-bottom: 12px;
}

.password-button {
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 14px;
    font-weight: 800;
    background: linear-gradient(135deg, #1f8fff, #0d6efd);
    color: white;
    box-shadow: 0 8px 20px rgba(13,110,253,0.28);
}

.password-link {
    display: inline-block;
    margin-top: 18px;
    color: #6c757d;
    font-weight: 700;
}

@media (max-width: 768px) {
    .password-page {
        min-height: 100vh;
        align-items: flex-start;
        padding: 24px 12px 48px;
    }

    .password-card {
        padding: 24px;
    }
}
</style>

<div class="password-page">
    <div class="container">
        <div class="password-card">
            <h1 class="password-title">パスワード変更</h1>
            <p class="password-text">現在のパスワードと新しいパスワードを入力してください。</p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="password-button" type="submit">パスワードを変更する</button>
            </form>

            <a class="password-link" href="{% url 'home' %}">ホームに戻る</a>
        </div>
    </div>
</div>
{% endblock %}

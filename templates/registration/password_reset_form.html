{% extends "base.html" %}

{% block title %}パスワード再設定{% endblock %}

{% block content %}
<style>
.reset-page {
    min-height: 78vh;
    background:
        linear-gradient(90deg, rgba(255,255,255,0.90), rgba(255,255,255,0.58)),
        url('/static/Yiepay2.png') center center / cover no-repeat;
    display: flex;
    align-items: center;
    padding: 48px 0;
}

.reset-card {
    max-width: 460px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.50);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    padding: 34px;
}

.reset-title {
    font-size: 1.6rem;
    font-weight: 900;
    color: #222;
    margin-bottom: 12px;
}

.reset-text {
    color: #5f6368;
    line-height: 1.8;
    margin-bottom: 24px;
}

.reset-card label {
    font-weight: 700;
    color: #222;
}

.reset-card input {
    width: 100%;
    border-radius: 14px;
    border: 1px solid rgba(13,110,253,0.18);
    background: rgba(255,255,255,0.95);
    padding: 13px 15px;
    margin: 8px 0 14px;
}

.reset-card input:focus {
    outline: none;
    border-color: #0d6efd;
    box-shadow: 0 0 0 4px rgba(13,110,253,0.10);
}

.reset-button {
    width: 100%;
    border: none;
    border-radius: 999px;
    padding: 14px;
    font-weight: 800;
    background: linear-gradient(135deg, #1f8fff, #0d6efd);
    color: white;
    box-shadow: 0 8px 20px rgba(13,110,253,0.28);
}

.reset-link {
    display: inline-block;
    margin-top: 18px;
    color: #6c757d;
    font-weight: 700;
}
</style>

<div class="reset-page">
    <div class="container">
        <div class="reset-card">
            <h1 class="reset-title">パスワード再設定</h1>
            <p class="reset-text">登録済みのメールアドレスを入力してください。新しいパスワードを設定するためのリンクを送信します。</p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="reset-button" type="submit">メールを送信する</button>
            </form>

            <a class="reset-link" href="{% url 'login' %}">ログイン画面に戻る</a>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}こどものパスワード変更完了{% endblock %}

{% block content %}
<style>
.child-password-page {
    min-height: 78vh;
    background:
        linear-gradient(90deg, rgba(255,255,255,0.90), rgba(255,255,255,0.58)),
        url('/static/Yiepay2.png') center center / cover no-repeat;
    display: flex;
    align-items: center;
    padding: 48px 0;
}

.child-password-card {
    max-width: 500px;
    background: rgba(255,255,255,0.84);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-radius: 24px;
    border: 1px solid rgba(255,255,255,0.50);
    box-shadow: 0 12px 32px rgba(0,0,0,0.12);
    padding: 34px;
}

.child-password-title {
    font-size: 1.6rem;
    font-weight: 900;
    color: #222;
    margin-bottom: 12px;
}

.child-password-text {
    color: #5f6368;
    line-height: 1.8;
    margin-bottom: 24px;
}

.child-password-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    padding: 12px 20px;
    background: linear-gradient(135deg, #f59e0b, #d97706);
    color: #fff;
    font-weight: 800;
    box-shadow: 0 8px 20px rgba(217,119,6,0.28);
}

.child-password-link:hover {
    color: #fff;
    text-decoration: none;
}
</style>

<div class="child-password-page">
    <div class="container">
        <div class="child-password-card">
            <h1 class="child-password-title">パスワードを変更しました</h1>
            <p class="child-password-text">{{ child.name }} の新しいパスワードを設定しました。</p>
            <a class="child-password-link" href="{% url 'status_change' child.id %}">こども情報に戻る</a>
        </div>
    </div>
</div>
{% endblock %}
